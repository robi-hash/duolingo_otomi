
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Otomí | Mi cuenta</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="encabezado text-center">
    <h1>Aprende Otomí</h1>
    <p>Inicia sesión</p>
</header>

<nav class="navegacion">
    <a href="index.html">Inicio</a>
    <a href="menu.html">Lecciones</a>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <section class="tarjeta">
                <h2>Iniciar sesión</h2>

                <form action="login.php" method="POST">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control mb-4" placeholder="Ingresa tu email" required>

                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" name="contrasena" id="contrasena" class="form-control mb-4" placeholder="Ingresa tu contraseña" required>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <p class="text-center mt-3">
                    ¿No tienes cuenta? <a href="#registro">Regístrate</a>
                </p>
            </section>

            <section class="tarjeta mt-4" id="registro">
                <h2>Crear cuenta</h2>

                <form action="registro.php" method="POST">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="form-control mb-3" required>

                    <label for="emailRegistro" class="form-label">Email</label>
                    <input type="email" name="email" id="emailRegistro" class="form-control mb-3" required>

                    <label for="contrasenaRegistro" class="form-label">Contraseña</label>
                    <input type="password" name="contrasena" id="contrasenaRegistro" class="form-control mb-3" minlength="4" required>

                    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                </form>
            </section>

            <section class="tarjeta mt-4 text-center">
                <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
            </section>

        </div>
    </div>
</main>

<footer class="text-center">
    <p>Aprende Otomí</p>
</footer>

</body>
</html>
