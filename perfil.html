
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Aprende Otomí</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            color: #263445;
        }

        .contenedor {
            display: flex;
            min-height: 100vh;
        }

        .menu {
            width: 240px;
            background: white;
            padding: 30px 20px;
            border-right: 1px solid #e5eaf0;
        }

        .menu h2 {
            margin-bottom: 35px;
            color: #6745c5;
        }

        .menu a {
            display: block;
            padding: 14px;
            margin-bottom: 8px;
            color: #526174;
            text-decoration: none;
            border-radius: 10px;
        }

        .menu a:hover,
        .menu a.activo {
            background: #eee9ff;
            color: #6745c5;
        }

        .principal {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        .navegacion {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 20px;
        }

        .navegacion a {
            color: #263445;
            font-size: 25px;
            text-decoration: none;
        }

        .portada {
            height: 190px;
            position: relative;
            background: linear-gradient(120deg, #7455c9, #a58be8);
            border-radius: 18px;
            margin-bottom: 75px;
        }

        .foto-contenedor {
            position: absolute;
            bottom: -60px;
            left: 35px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            border: 5px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .foto-contenedor img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-predeterminada {
            font-size: 65px;
        }

        .datos {
            margin-bottom: 35px;
        }

        .datos h1 {
            margin-bottom: 15px;
        }

        .datos p {
            margin: 8px 0;
            color: #526174;
        }

        .estadisticas h2,
        .logros h2 {
            margin-bottom: 20px;
        }

        .tarjetas {
            display: grid;
            grid-template-columns: repeat(2, minmax(150px, 220px));
            gap: 18px;
            margin-bottom: 40px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 12px #0000000d;
        }

        .tarjeta h3 {
            margin: 0 0 15px;
            font-size: 16px;
            color: #667085;
        }

        .valor {
            font-size: 28px;
            font-weight: bold;
            color: #7455c9;
        }

        .logros-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .logro {
            width: 210px;
            padding: 20px;
            background: white;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 12px #0000000d;
        }

        .logro span {
            font-size: 38px;
        }

        .logro p {
            margin-bottom: 5px;
        }

        .mensaje {
            padding: 20px;
            background: white;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .contenedor {
                flex-direction: column;
            }

            .menu {
                width: 100%;
                padding: 15px;
            }

            .menu h2 {
                margin-bottom: 15px;
            }

            .menu a {
                display: inline-block;
                padding: 9px;
                font-size: 13px;
            }

            .principal {
                padding: 18px;
            }

            .tarjetas {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .tarjeta {
                padding: 14px;
            }

            .valor {
                font-size: 23px;
            }
        }
    </style>

    <script src="perfil.js" defer></script>
</head>

<body>

<div class="contenedor">

    <aside class="menu">

        <h2>Aprende Otomí</h2>

        <a href="menu.html">● Aprender</a>
        <a href="leccion1.html">● Practicar</a>
        <a href="#">● Ligas</a>
        <a href="#">● Desafíos</a>
        <a href="#">● Tienda</a>
        <a href="perfil.html" class="activo">● Perfil</a>

    </aside>

    <main class="principal">

        <div class="navegacion">
            <a href="menu.html" title="Inicio">⌂</a>
            <a href="menu.html" title="Menú">☰</a>
        </div>

        <section class="portada">

            <div class="foto-contenedor" id="fotoPerfil">
                <span class="foto-predeterminada">👤</span>
            </div>

        </section>

        <section class="datos" id="datosPerfil">

            <h1>Mi perfil</h1>
            <p>Cargando información...</p>

        </section>

        <section class="estadisticas">

            <h2>Estadísticas</h2>

            <div class="tarjetas" id="estadisticas">

                <div class="mensaje">
                    Cargando estadísticas...
                </div>

            </div>

        </section>

        <section class="logros">

            <h2>Logros</h2>

            <div class="logros-contenedor">

                <div class="logro">
                    <span>🏆</span>
                    <p><strong>¡A la primera!</strong></p>
                    <p>Logro de aprendizaje</p>
                </div>

                <div class="logro">
                    <span>🔒</span>
                    <p><strong>Próximo logro</strong></p>
                    <p>Por desbloquear</p>
                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
